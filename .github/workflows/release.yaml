name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment; current publishes the version already in package.json
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major
      branch:
        description: Stable releases use main; prereleases use rc
        required: true
        default: main
        type: choice
        options:
          - main
          - rc
      dry_run:
        description: Validate the release without committing, tagging, pushing, or publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-release-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup npm with Trusted Publishing support
        run: npm install --global npm@11.18.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Check lint
        run: bun run check:lint

      - name: Check formatting
        run: bun run check:format

      - name: Build
        run: bun run build

      - name: Inspect package contents
        run: bun run pack:check

      - name: Configure release Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ "$DRY_RUN" != "true" && -n "$BOOTSTRAP_NPM_TOKEN" ]]; then
            export NODE_AUTH_TOKEN="$BOOTSTRAP_NPM_TOKEN"
          fi

          DRY_RUN_ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_ARGS=(--dry-run)
          fi

          case "$RELEASE_BRANCH:$INCREMENT" in
            main:current)
              bun run release -- --ci --no-increment "${DRY_RUN_ARGS[@]}"
              ;;
            main:patch|main:minor|main:major)
              bun run release -- --ci "$INCREMENT" "${DRY_RUN_ARGS[@]}"
              ;;
            rc:current)
              bun run release -- --ci --preRelease "${DRY_RUN_ARGS[@]}"
              ;;
            rc:patch|rc:minor|rc:major)
              bun run release -- --ci "$INCREMENT" --preRelease=rc "${DRY_RUN_ARGS[@]}"
              ;;
          esac
