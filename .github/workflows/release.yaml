name: Release to npm

on:
  release:
    types:
      - published

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Check lint
        run: bun run check:lint

      - name: Check formatting
        run: bun run check:format

      - name: Build
        run: bun run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public
