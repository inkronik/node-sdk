name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Stable releases use main; prereleases use rc
        required: true
        default: main
        type: choice
        options:
          - main
          - rc
      dry_run:
        description: Validate the release without committing, tagging, pushing, or publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-release-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup npm with Trusted Publishing support
        run: npm install --global npm@11.19.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Check lint
        run: bun run check:lint

      - name: Check formatting
        run: bun run check:format

      - name: Build
        run: bun run build

      - name: Inspect package contents
        run: bun run pack:check

      - name: Configure release Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          DRY_RUN_ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_ARGS=(--dry-run)
          fi

          case "$RELEASE_BRANCH" in
            main)
              bun run release -- --ci "${DRY_RUN_ARGS[@]}"
              ;;
            rc)
              bun run release -- --ci --preRelease=rc "${DRY_RUN_ARGS[@]}"
              ;;
          esac
